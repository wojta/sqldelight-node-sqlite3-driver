name: Build CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [ published ]

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  detekt:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.head_ref }}

      - name: Setup detekt
        uses: peter-murray/setup-detekt@v2
        with:
          detekt_version: 1.22.0

      - name: Run detekt
        run: detekt-cli -c gradle/detekt/detekt.yml

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        env:
          PACKAGE_VERSION: ${{ github.event.release.tag_name }}
        run: ./gradlew build

  dependency-check:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Get cache week
        id: date
        run: echo "week=$(date -u +%Y-W%U)" >> "$GITHUB_OUTPUT"

      - name: Cache dependency-check NVD data
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-data-${{ steps.date.outputs.week }}
          restore-keys: dependency-check-data-

      - name: Run OWASP dependency-check
        id: analyze
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.html

      - name: Build Markdown summary
        if: always()
        run: |
          REPORT=build/reports/dependency-check-report.json
          # Prefer NPM/GHSA scoring over NVD for npm deps, NVD often over-scores JS-ecosystem CVEs.
          FINDINGS='
            def score: (.cvssv3.baseScore // .cvssv2.score // 0);
            def relevant($d): ($d.vulnerabilities | any(.source == "NPM"));
            [ .dependencies[]? | select(.vulnerabilities != null) as $d
              | $d.vulnerabilities[]
              | select(if (relevant($d)) then .source == "NPM" else true end)
              | select(score >= 7)
              | {fileName: $d.fileName, name, severity: (.severity // "n/a"), cvss: score, source: (.source // "n/a")}
            ]
          '
          {
            echo "### OWASP Dependency-Check results"
            echo
            echo "_Showing HIGH/CRITICAL findings (CVSS >= 7), GHSA-preferred over NVD for npm deps. Full report in the workflow artifact._"
            echo
            COUNT=$(jq "$FINDINGS | length" "$REPORT")
            if [ "$COUNT" -eq 0 ]; then
              echo "No HIGH/CRITICAL vulnerabilities found."
            else
              echo "| Dependency | CVE | Severity | CVSS | Source |"
              echo "|---|---|---|---|---|"
              jq -r "$FINDINGS"' | .[] | "| \(.fileName) | \(.name) | \(.severity) | \(.cvss) | \(.source) |"' "$REPORT"
            fi
          } > dependency-check-summary.md

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: dependency-check
          path: dependency-check-summary.md

      - name: Fail on vulnerabilities above threshold
        if: steps.analyze.outcome == 'failure'
        run: exit 1

  release:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: gradle

      - name: Setup gradle
        uses: gradle/gradle-build-action@v3

      - name: Release to sonatype
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_SECRET }}
          GPG_KEY_PASSWORD: ${{ secrets.GPG_KEY_PASSWORD }}
          GPG_KEY_SECRET: ${{ secrets.GPG_KEY_SECRET }}
          PACKAGE_VERSION: ${{ github.event.release.tag_name }}
        run: ./gradlew publishToMavenCentral

  publish:
    if: ${{ github.event_name == 'release' }}
    needs:
      - build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup gradle
        uses: gradle/gradle-build-action@v3

      - name: Generate docs with dokka
        env:
          PACKAGE_VERSION: ${{ github.event.release.tag_name }}
        run: ./gradlew dokkaGeneratePublicationHtml

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ github.workspace }}/build/dokka/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
